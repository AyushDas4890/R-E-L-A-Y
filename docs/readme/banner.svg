<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Relay: team chat that talks back">
  <defs>
    <radialGradient id="sun" cx="62%" cy="0%" r="85%">
      <stop offset="0" stop-color="#f0b07a" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#c8693c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#120806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a120b"/>
      <stop offset="1" stop-color="#0d0504"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#fff"/>
      <stop offset=".5" stop-color="#9df5c5"/>
      <stop offset=".55" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <text x="4" y="15" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c8693c" fill-opacity=".22">#</text>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .draw { fill: none; stroke: #f0b07a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.6s ease-in-out .2s forwards; }
      .r { stroke: #2a120b; stroke-width: 5; animation-delay: 1.9s; stroke-dasharray: 90; stroke-dashoffset: 90; }
      .fill { fill: #f0b07a; opacity: 0; animation: fade .6s ease 1.8s forwards; }
      .word { font: 700 64px 'Audiowide', 'Segoe UI', system-ui, sans-serif; letter-spacing: 2px; fill: url(#shine); }
      .tag { font: 600 30px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f6e7da; opacity: 0; animation: rise .8s ease 1.2s forwards; }
      .sub { font: 400 18px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #d6b9a6; opacity: 0; animation: rise .8s ease 1.6s forwards; }
      .chip { opacity: 0; animation: rise .6s ease forwards; }
      .chip rect { fill: #1a0b07; stroke: #9df5c5; stroke-opacity: .45; }
      .chip text { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #9df5c5; }
      .pulse { fill: #9df5c5; animation: pulse 2.4s ease-in-out infinite; }
      .blink { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="22" fill="url(#sun)"/>

  <!-- Logo mark draws itself, then fills -->
  <g transform="translate(70 70) scale(1.6)" filter="url(#glow)">
    <path class="fill" d="M14 6h36a10 10 0 0 1 10 10v24a10 10 0 0 1-10 10H30l-12 10v-10h-4A10 10 0 0 1 4 40V16A10 10 0 0 1 14 6z"/>
    <path class="draw" d="M14 6h36a10 10 0 0 1 10 10v24a10 10 0 0 1-10 10H30l-12 10v-10h-4A10 10 0 0 1 4 40V16A10 10 0 0 1 14 6z"/>
    <path class="draw r" d="M22 40V18h11a7 7 0 0 1 0 14h-6l12 8"/>
  </g>
  <text class="word" x="190" y="135">relay</text>

  <text class="tag" x="72" y="205">Team chat that talks back.</text>
  <text class="sub" x="72" y="238">Channels, threads, huddles, canvases and a bot teammate. Every premium feature unlocked.</text>

  <g class="chip" style="animation-delay:2s"><rect x="72" y="266" width="128" height="34" rx="17"/><text x="92" y="288">⚡ Real-time</text></g>
  <g class="chip" style="animation-delay:2.15s"><rect x="212" y="266" width="160" height="34" rx="17"/><text x="232" y="288">🎧 WebRTC huddles</text></g>
  <g class="chip" style="animation-delay:2.3s"><rect x="384" y="266" width="140" height="34" rx="17"/><text x="404" y="288">🤖 Relay Bot</text></g>
  <g class="chip" style="animation-delay:2.45s"><rect x="536" y="266" width="150" height="34" rx="17"/><text x="556" y="288">🔒 Admin + audit</text></g>

  <!-- Robot face -->
  <g transform="translate(905 70)">
    <ellipse cx="120" cy="230" rx="110" ry="14" fill="#000" opacity=".35"/>
    <rect x="10" y="20" width="220" height="190" rx="70" fill="#efe4ee"/>
    <rect x="34" y="44" width="172" height="142" rx="52" fill="#120a0a" stroke="#ffd27a" stroke-width="5" filter="url(#glow)"/>
    <g class="blink">
      <path d="M78 108q14-18 28 0" fill="none" stroke="#ffd27a" stroke-width="7" stroke-linecap="round"/>
      <path d="M134 108q14-18 28 0" fill="none" stroke="#ffd27a" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path d="M100 136q20 22 40 0z" fill="#ffd27a"/>
    <circle cx="6" cy="114" r="18" fill="#c99172"/>
    <circle cx="234" cy="114" r="18" fill="#c99172"/>
    <!-- speech bubble -->
    <g class="chip" style="animation-delay:2.6s">
      <rect x="-150" y="-30" width="190" height="44" rx="14" fill="#0d0d0d"/>
      <text x="-134" y="-2" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#9df5c5">Hi! Ask me anything.</text>
    </g>
  </g>

  <!-- signal dots -->
  <g>
    <circle class="pulse" cx="1150" cy="40" r="5"/>
    <circle class="pulse" cx="1130" cy="40" r="5" style="animation-delay:.3s"/>
    <circle class="pulse" cx="1110" cy="40" r="5" style="animation-delay:.6s"/>
  </g>
</svg>
