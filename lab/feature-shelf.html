<!doctype html>
<html lang="en">

<title>Relay features (preview)</title>
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;--blue-ink:#0066cc;--paper:#f5f5f7;--line:rgba(0,0,0,.08);
--out:cubic-bezier(.32,.72,0,1);--soft:cubic-bezier(.25,.1,.25,1);
--H:min(52vh,36vw);--cy:49%;
--sans:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:linear-gradient(180deg,#d9e9f6 0,#e9f1f8 30%,var(--paper) 64%);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
/* header: the same floating pill as the site */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(980px,calc(100% - 32px));height:52px;padding:0 8px 0 20px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 1px rgba(0,0,0,.04),0 8px 24px rgba(0,40,80,.08);z-index:30;font-size:13px}
.nav .brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.nav ul{display:flex;gap:28px;list-style:none;color:var(--muted)}.nav ul a:hover{color:var(--ink)}
.nav .cta{height:36px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;font-weight:500}
h1.hero-t{position:fixed;left:0;right:0;top:calc(52px + 4.2vh);text-align:center;font-weight:600;font-size:clamp(26px,3.6vw,46px);letter-spacing:-.035em;line-height:1.05;z-index:5;pointer-events:none;padding:0 20px}
h1.hero-t span{color:var(--muted)}
.floor{position:fixed;left:50%;top:calc(var(--cy) + var(--H)*.47);width:min(96vw,calc(var(--H)*3.4));height:calc(var(--H)*.22);transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 40%,rgba(20,30,50,.18),rgba(20,30,50,.06) 55%,transparent 72%);z-index:5;pointer-events:none}
.shelf{position:fixed;left:0;right:0;top:calc(var(--cy) - var(--H)/2 - 50px);height:calc(var(--H) + 100px);perspective:1400px;z-index:10;touch-action:pan-y;cursor:grab}
.shelf.drag{cursor:grabbing}
.stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tape{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;top:calc(var(--Hp)/-2);height:var(--Hp);backface-visibility:hidden;border-radius:22px;overflow:hidden}
.face::after{content:"";position:absolute;inset:0;background:#0b1220;opacity:var(--shade,0);pointer-events:none;z-index:3}
.sp::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.09),rgba(0,0,0,0) 14%,rgba(255,255,255,.35) 24%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 84%,rgba(0,0,0,.08))}
.cv::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.34) 47%,rgba(255,255,255,.06) 55%,transparent 68%);background-size:240% 100%;background-position:var(--gl,50%) 0;opacity:var(--glo,0)}
.cv::after{box-shadow:none}
.lf,.bk{background:#e9e9ed;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.lf{width:var(--dp);left:calc(var(--dp)/-2);transform:rotateY(-90deg) translateZ(calc(var(--wsp)/2))}
.bk{width:var(--wsp);left:calc(var(--wsp)/-2);transform:rotateY(180deg) translateZ(calc(var(--dp)/2))}
.sp{width:var(--wsp);left:calc(var(--wsp)/-2);transform:translateZ(calc(var(--dp)/2));position:absolute;display:flex;flex-direction:column;align-items:center;gap:calc(var(--wsp)*.34);padding-top:calc(var(--wsp)*.3);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.tape.alt .sp{background:#f1f1f4}.tape .sp{background:#fff}
.sp .g{width:calc(var(--wsp)*.44);height:calc(var(--wsp)*.44);display:grid;place-items:center;color:var(--blue);font-weight:600;font-size:calc(var(--wsp)*.34)}
.sp .g svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sp .t{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:500;font-size:calc(var(--wsp)*.38);letter-spacing:-.015em;white-space:nowrap;color:var(--ink)}
.cv{width:var(--dp);left:calc(var(--dp)/-2);transform:rotateY(90deg) translateZ(calc(var(--wsp)/2));background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.12),0 40px 70px -30px rgba(20,30,50,.5),0 0 0 1px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.cv svg{display:block;width:100%;height:100%;font-family:var(--sans)}
.cap{position:fixed;left:50%;top:calc(var(--cy) + var(--H)/2 + 3.6vh);transform:translateX(-50%);display:grid;gap:4px;justify-items:center;z-index:12;text-align:center;width:min(86vw,560px)}
.stack{display:grid;justify-items:center}.stack>span{grid-area:1/1;display:block;will-change:transform,opacity}
.cap .ti{font-weight:600;font-size:clamp(26px,3vw,38px);letter-spacing:-.03em;line-height:1.1}
.cap .de{font-size:clamp(15px,1.4vw,19px);color:var(--muted);line-height:1.35;letter-spacing:-.01em}
.more{margin-top:8px;display:inline-flex;align-items:center;gap:4px;color:var(--blue-ink);font-size:17px;letter-spacing:-.01em;padding:6px 10px;border-radius:999px;transition:background-color .2s var(--soft)}
.more:hover{background:rgba(0,113,227,.08)}.more svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arr{position:fixed;top:auto;bottom:19px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:14;background:rgba(0,0,0,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background-color .2s var(--soft),transform .12s ease-out}
.arr:hover{background:rgba(0,0,0,.1)}.arr:active{transform:scale(.94)}
.arr svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arr.p{left:calc(50% - 167px)}.arr.n{left:calc(50% + 123px)}
.dots{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:14}
.dots button{width:7px;height:7px;padding:0;border-radius:4px;background:rgba(0,0,0,.22);transition:width .5s var(--out),background-color .3s var(--soft)}
.dots button.on{width:22px;background:var(--ink)}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none}.sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(245,245,247,.55);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.panel{position:absolute;left:50%;top:50%;width:min(1040px,92vw);height:min(620px,86vh);margin:calc(min(620px,86vh)/-2) 0 0 calc(min(1040px,92vw)/-2);border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 40px 120px -40px rgba(0,0,0,.35);display:grid;grid-template-columns:1fr auto;gap:40px;padding:48px 48px 48px 56px;align-items:center}
.panel .x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.06);display:grid;place-items:center;transition:background-color .2s var(--soft)}
.panel .x:hover{background:rgba(0,0,0,.1)}.panel .x svg{width:12px;height:12px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}
.txt{display:grid;gap:14px;max-width:460px}
.txt .k{color:var(--muted);font-size:17px;letter-spacing:-.01em}
.txt h2{font-weight:600;font-size:clamp(40px,5vw,64px);letter-spacing:-.04em;line-height:1.02}
.txt p{font-size:21px;line-height:1.4;letter-spacing:-.012em;color:#3a3a3c}
.txt .hint{color:var(--muted);font-size:15px}
.txt .go{margin-top:8px;height:44px;padding:0 22px;border-radius:999px;background:var(--blue);color:#fff;font-weight:500;font-size:16px;display:inline-flex;align-items:center;width:max-content;transition:background-color .2s var(--soft),transform .1s ease-out}
.txt .go:hover{background:#0077ed}.txt .go:active{transform:scale(.97)}
.slot{height:100%;aspect-ratio:474/900;justify-self:end}
.hero{position:fixed;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -28px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.06);background:#fff;transform-origin:0 0;will-change:transform}
.hero svg{display:block;width:100%;height:100%;font-family:var(--sans)}
@media(max-width:767px){
:root{--H:min(76vw,42svh);--cy:45%}
.nav ul,.nav .cta{display:none}
h1.hero-t{top:calc(52px + 5vh)}
.panel{width:calc(100vw - 24px);height:92svh;margin:calc(92svh/-2) 0 0 calc((100vw - 24px)/-2);grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:56px 24px 24px;overflow:auto;gap:20px;align-items:start}
.slot{order:-1;height:40svh;justify-self:center}.txt h2{font-size:38px}
}
@media(max-height:740px) and (min-width:768px){:root{--H:min(48vh,34vw)}.more{display:none}}
@media(prefers-reduced-motion:reduce){.dots button,.arr,.more{transition:none}}
</style>
</head>
